		#RDX_KeyNone = Keine
		#RDX_MsgNoPartHit = Dort ist kein Teil. Versuche es erneut.
		#RDX_MsgIgnored = Ignoriert: <<1>>. Reforged bemalt diesen Teiltyp nicht mehr.
		#RDX_MsgReported = Teilbericht in KSP.log geschrieben: <<1>>
		#RDX_MsgSettingsSaved = Einstellungen gespeichert.
		#RDX_HdrKeybinds = Tastenbelegung
		#RDX_KeyPress = Taste oder Maustaste drücken...
		#RDX_HintKeybinds = Auf eine Belegung klicken, dann Taste oder Maustaste drücken.\nEsc bricht ab, Rücktaste löscht sie.
		#RDX_HdrPaint = Farbe
		#RDX_EvenShine = Gleichmäßiger Lackglanz
		#RDX_HintEvenShine = An: bemalte Teile bekommen ein einheitliches Stock-Finish, damit alle gleich aussehen.\nAus: jedes Teil behält seinen eigenen Stock-Glanz.
		#RDX_HdrGameplay = Spielmechanik
		#RDX_TileWeight = Hitzekacheln erhöhen das Gewicht
		#RDX_TileHeat = Hitzekacheln erhöhen die Hitzebeständigkeit
		#RDX_HintRO = Realism Overhaul erkannt: Hitzekacheln sind nur Optik.\nSie ändern weder Hitzebeständigkeit noch Gewicht.
		#RDX_HintTileWeight = Gewicht: etwa 8 kg pro Quadratmeter Kacheln.\nHitzebeständigkeit: Das Teil hält 2,5-mal mehr Hitze aus.
		#RDX_HdrPerformance = Leistung
		#RDX_GradualLoad = Bemalte Fahrzeuge schrittweise laden
		#RDX_HintGradualLoad = Aus: kurze Pause, dann erscheint das Fahrzeug fertig bemalt.\nAn: das Fahrzeug erscheint sofort und die Farbe wird nachgeladen.
		#RDX_LowVram = Wenig-VRAM-Modus
		#RDX_HintLowVram = Bemalung braucht etwa 75 % weniger Grafikspeicher und\nlädt schneller, sieht aber aus der Nähe weicher aus.
		#RDX_HdrTrouble = Fehlersuche
		#RDX_MsgClickPart = Auf das zu meldende Teil zeigen und <<1>> drücken.
		#RDX_ReportPart = Teil melden
		#RDX_HintTrouble = Für ein Teil, das falsch bemalt wird. Ein Bericht wird\nfür den Support in KSP.log geschrieben.
		#RDX_MsgIgnorePick = Auf das zu ignorierende Teil zeigen und <<1>> drücken.
		#RDX_IgnorePart = Teil ignorieren
		#RDX_HintIgnore = Reforged bemalt diesen Teiltyp gar nicht mehr.\nPraktisch, wenn ein Teil aus einer anderen Mod falsch aussieht.
		#RDX_IgnoredParts = Ignorierte Teile:
		#RDX_HintIgnoredList = Drücke x, damit das Teil wieder bemalt werden kann.
		#RDX_MsgUnignored = <<1>> kann wieder bemalt werden.
		#RDX_CacheSize = Farb-Cache: <<1>>
		#RDX_ClearCache = Farb-Cache leeren
		#RDX_MsgCacheCleared = Farb-Cache geleert.
		#RDX_HintCache = Bemalung wird gespeichert, damit Fahrzeuge schneller laden.\nLeere ihn, falls ein bemaltes Teil einmal falsch aussieht.
		#RDX_CacheLimit = Cache-Limit: <<1>>
		#RDX_HintCacheLimit = Wird der Cache größer, wird die älteste Bemalung\nentfernt. Sie wird bei Bedarf neu erstellt.
