		#RDX_EvenShine = Brillance uniforme
		#RDX_HintEvenShine = Activé : les pièces peintes reçoivent une finition d'origine identique, elles sont toutes assorties.\nDésactivé : chaque pièce garde sa brillance d'origine.
		#RDX_HdrGameplay = Jouabilité
		#RDX_TileWeight = Les tuiles thermiques ajoutent du poids
