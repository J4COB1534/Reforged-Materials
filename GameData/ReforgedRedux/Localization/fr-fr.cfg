		#RDX_HintRO = Realism Overhaul détecté : les tuiles thermiques sont purement visuelles.\nElles ne changent ni la résistance à la chaleur ni le poids.
		#RDX_HintTileWeight = Poids : environ 8 kg par mètre carré de tuiles.\nRésistance à la chaleur : la pièce supporte 2,5 fois plus de chaleur.
		#RDX_HdrPerformance = Performances
