		#RDX_HintGradualLoad = Désactivé : courte pause, puis le vaisseau apparaît entièrement peint.\nActivé : le vaisseau apparaît tout de suite et la peinture se complète.
		#RDX_LowVram = Mode faible VRAM
		#RDX_HintLowVram = La peinture utilise environ 75 % de mémoire graphique en moins\net peint plus vite, mais paraît plus douce de près.
